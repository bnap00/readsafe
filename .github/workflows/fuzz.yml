name: Fuzz

# The security model requires fuzzing the format parsers and the redaction
# paths. These targets run on a schedule (and can be kicked off by hand) rather
# than on every PR, since each run is time-boxed minutes rather than seconds.
on:
  schedule:
    # Daily at 04:17 UTC. Scheduled runs use the longer 1800s time box below;
    # cron only fires on the default branch.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to run each fuzz target"
        required: false
        default: "300"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dotenv_roundtrip, jsonish_safe_subset]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly (branch)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        env:
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '1800' }}
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${MAX_TOTAL_TIME} \
            -print_final_stats=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
